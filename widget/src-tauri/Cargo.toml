[package]
name = "taskdeck-widget"
version = "0.2.4"
description = "Vibe-TaskDeck 桌面挂件（置顶胶囊 + 展开面板，纯客户端直连 SQLite）"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
tauri-plugin-notification = "2.3.3"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-opener = "2"
# 版本检查：GitHub Releases API（rustls 免 OpenSSL 系统依赖；
# system-proxy 读 Windows 系统代理——国内环境 GitHub 直连常不通）
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "system-proxy"] }

[target.'cfg(windows)'.dependencies]
# 左键状态查询（拖拽检测：拖拽中不做位置 clamp，保证跨屏自由拖动）
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[features]
# custom-protocol：release/正式构建内嵌 frontendDist 产物（tauri 依此判定 dev=false）。
# dev 流程（vite devUrl 热更）用 `cargo run --no-default-features` 关掉它——
# 与 tests/README.md 真实层流程一致。
# transparent 在 Windows 无需 feature（macOS 才需要 macos-private-api）
default = ["custom-protocol"]
# 转发到 tauri 依赖的 feature（tauri 依此判定 dev=false → 内嵌产物）
custom-protocol = ["tauri/custom-protocol"]
