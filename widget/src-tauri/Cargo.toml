[package]
name = "dashi-taskboard-widget"
version = "0.1.0"
description = "dashi-taskboard 桌面挂件（置顶胶囊 + 展开面板，纯客户端直连 SQLite）"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

[features]
# 默认不启用任何额外 feature；transparent 在 Windows 无需 feature（macOS 才需要 macos-private-api）
